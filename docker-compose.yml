version: "3.9"

services:
  web:
    build: .
    container_name: trufit-web
    env_file: .env
    ports:
      - "8000:8000" # <-- publish to host
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8000/"] # runs inside the container
      interval: 20s
      timeout: 3s
      retries: 5

  nginx:
    image: nginx:stable
    container_name: trufit-nginx
    depends_on: [web]
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped

  celery_worker:
    build: .
    container_name: trufit-celery-worker
    env_file: .env
    command: celery -A trufit_backend worker -l info
    # if you have an external Redis, this is enough;
    # if Redis is another container, add: depends_on: [redis]
    restart: unless-stopped

  celery_beat:
    build: .
    container_name: trufit-celery-beat
    env_file: .env
    command: celery -A trufit_backend beat -l info
    restart: unless-stopped
